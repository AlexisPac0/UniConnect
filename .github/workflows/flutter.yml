name: Flutter CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  flutter:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Flutter analyze
            command: flutter analyze --no-pub
          - name: Flutter test
            command: flutter test --no-pub
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Show SDK version
        run: flutter --version
      - name: Install dependencies
        run: flutter pub get
      - name: Run check
        run: ${{ matrix.command }}
