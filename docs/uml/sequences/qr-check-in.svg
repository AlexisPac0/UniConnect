<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="2360" viewBox="0 0 1700 2360"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#254c72"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Arial, sans-serif"><text x="35" y="40" text-anchor="start" fill="#132d48" font-size="27">QR attendance check-in</text><text x="35" y="72" text-anchor="start" fill="#536a80" font-size="17">Proposed flow: SCRUM-38, 39, 40, 41</text><path d="M 130 185 V 2340" stroke="#bdc8d3" stroke-dasharray="6 6"/><rect x="20" y="100" width="220" height="85" rx="5" fill="#eaf1fa" stroke="#6586a8"/><text x="130" y="125" text-anchor="middle" fill="#18324b" font-size="15">Student</text><path d="M 370 185 V 2340" stroke="#bdc8d3" stroke-dasharray="6 6"/><rect x="260" y="100" width="220" height="85" rx="5" fill="#eaf1fa" stroke="#6586a8"/><text x="370" y="125" text-anchor="middle" fill="#18324b" font-size="15">Scanner page /</text><text x="370" y="144" text-anchor="middle" fill="#18324b" font-size="15">AttendanceCubit</text><path d="M 610 185 V 2340" stroke="#bdc8d3" stroke-dasharray="6 6"/><rect x="500" y="100" width="220" height="85" rx="5" fill="#eaf1fa" stroke="#6586a8"/><text x="610" y="125" text-anchor="middle" fill="#18324b" font-size="15">Camera / location adapter</text><path d="M 850 185 V 2340" stroke="#bdc8d3" stroke-dasharray="6 6"/><rect x="740" y="100" width="220" height="85" rx="5" fill="#eaf1fa" stroke="#6586a8"/><text x="850" y="125" text-anchor="middle" fill="#18324b" font-size="15">CheckInWithQrToken use</text><text x="850" y="144" text-anchor="middle" fill="#18324b" font-size="15">case</text><path d="M 1090 185 V 2340" stroke="#bdc8d3" stroke-dasharray="6 6"/><rect x="980" y="100" width="220" height="85" rx="5" fill="#eaf1fa" stroke="#6586a8"/><text x="1090" y="125" text-anchor="middle" fill="#18324b" font-size="15">AttendanceRepositoryImpl</text><text x="1090" y="144" text-anchor="middle" fill="#18324b" font-size="15">/ remote data source</text><path d="M 1330 185 V 2340" stroke="#bdc8d3" stroke-dasharray="6 6"/><rect x="1220" y="100" width="220" height="85" rx="5" fill="#eaf1fa" stroke="#6586a8"/><text x="1330" y="125" text-anchor="middle" fill="#18324b" font-size="15">Firebase callable</text><text x="1330" y="144" text-anchor="middle" fill="#18324b" font-size="15">function</text><path d="M 1570 185 V 2340" stroke="#bdc8d3" stroke-dasharray="6 6"/><rect x="1460" y="100" width="220" height="85" rx="5" fill="#eaf1fa" stroke="#6586a8"/><text x="1570" y="125" text-anchor="middle" fill="#18324b" font-size="15">Cloud Firestore</text><rect x="40" y="1373" width="1620" height="534" fill="none" stroke="#90a4b8"/><rect x="32" y="1063" width="1636" height="866" fill="none" stroke="#90a4b8"/><rect x="24" y="403" width="1652" height="1796" fill="none" stroke="#90a4b8"/><rect x="45" y="197" width="1610" height="37" rx="5" fill="#fff5ce" stroke="#d6bd68"/><text x="850" y="215" text-anchor="middle" fill="#18324b" font-size="15">Precondition: authenticated student; professor opened a session and displays a server-signed rotating QR token.</text><text x="250" y="267" text-anchor="middle" fill="#18324b" font-size="15">1. Open scanner and scan QR</text><path d="M 130 287 H 370" fill="none" stroke="#254c72" stroke-width="1.5"  marker-end="url(#arrow)"/><text x="490" y="323" text-anchor="middle" fill="#18324b" font-size="15">2. Request camera and</text><text x="490" y="343" text-anchor="middle" fill="#18324b" font-size="15">location permission;</text><text x="490" y="363" text-anchor="middle" fill="#18324b" font-size="15">explain purpose</text><path d="M 370 383 H 610" fill="none" stroke="#254c72" stroke-width="1.5"  marker-end="url(#arrow)"/><text x="46" y="424" text-anchor="start" fill="#34537a" font-size="15">alt [Permission denied or location unavailable]</text><text x="490" y="465" text-anchor="middle" fill="#18324b" font-size="15">3. Permission / location</text><text x="490" y="485" text-anchor="middle" fill="#18324b" font-size="15">failure</text><path d="M 610 505 H 370" fill="none" stroke="#254c72" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arrow)"/><text x="250" y="541" text-anchor="middle" fill="#18324b" font-size="15">4. Explain how to retry; do</text><text x="250" y="561" text-anchor="middle" fill="#18324b" font-size="15">not submit check-in</text><path d="M 370 581 H 130" fill="none" stroke="#254c72" stroke-width="1.5"  marker-end="url(#arrow)"/><path d="M 30 601 H 1670" stroke="#90a4b8" stroke-dasharray="5 4"/><text x="54" y="622" text-anchor="start" fill="#34537a" font-size="15">[QR scanned and location available]</text><text x="490" y="663" text-anchor="middle" fill="#18324b" font-size="15">5. sessionId, signed token,</text><text x="490" y="683" text-anchor="middle" fill="#18324b" font-size="15">current coordinates</text><path d="M 610 703 H 370" fill="none" stroke="#254c72" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arrow)"/><text x="610" y="739" text-anchor="middle" fill="#18324b" font-size="15">6. Check in; show submitting state</text><path d="M 370 759 H 850" fill="none" stroke="#254c72" stroke-width="1.5"  marker-end="url(#arrow)"/><text x="970" y="795" text-anchor="middle" fill="#18324b" font-size="15">7.</text><text x="970" y="815" text-anchor="middle" fill="#18324b" font-size="15">checkInWithQrToken(sessionId,</text><text x="970" y="835" text-anchor="middle" fill="#18324b" font-size="15">token, location)</text><path d="M 850 855 H 1090" fill="none" stroke="#254c72" stroke-width="1.5"  marker-end="url(#arrow)"/><text x="1210" y="891" text-anchor="middle" fill="#18324b" font-size="15">8. Callable request with</text><text x="1210" y="911" text-anchor="middle" fill="#18324b" font-size="15">Firebase Auth context</text><path d="M 1090 931 H 1330" fill="none" stroke="#254c72" stroke-width="1.5"  marker-end="url(#arrow)"/><text x="1340" y="967" text-anchor="start" fill="#18324b" font-size="15">9. Require authenticated</text><text x="1340" y="987" text-anchor="start" fill="#18324b" font-size="15">student; derive uid from</text><text x="1340" y="1007" text-anchor="start" fill="#18324b" font-size="15">auth</text><path d="M 1330 1027 h 190 v 18 h -190" fill="none" stroke="#254c72" stroke-width="1.5"  marker-end="url(#arrow)"/><text x="54" y="1084" text-anchor="start" fill="#34537a" font-size="15">group [Server transaction: validation and record creation]</text><text x="1450" y="1125" text-anchor="middle" fill="#18324b" font-size="15">10. Read session, lecture,</text><text x="1450" y="1145" text-anchor="middle" fill="#18324b" font-size="15">user, enrolment and</text><text x="1450" y="1165" text-anchor="middle" fill="#18324b" font-size="15">existing record</text><path d="M 1330 1185 H 1570" fill="none" stroke="#254c72" stroke-width="1.5"  marker-end="url(#arrow)"/><text x="1450" y="1221" text-anchor="middle" fill="#18324b" font-size="15">11. Authoritative state</text><path d="M 1570 1241 H 1330" fill="none" stroke="#254c72" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arrow)"/><text x="1340" y="1277" text-anchor="start" fill="#18324b" font-size="15">12. Check open session,</text><text x="1340" y="1297" text-anchor="start" fill="#18324b" font-size="15">enrolment, signed token +</text><text x="1340" y="1317" text-anchor="start" fill="#18324b" font-size="15">expiry, geofence</text><path d="M 1330 1337 h 190 v 18 h -190" fill="none" stroke="#254c72" stroke-width="1.5"  marker-end="url(#arrow)"/><text x="62" y="1394" text-anchor="start" fill="#34537a" font-size="15">alt [Invalid token / closed session / wrong course / outside area]</text><text x="1210" y="1435" text-anchor="middle" fill="#18324b" font-size="15">13. Typed rejection; no</text><text x="1210" y="1455" text-anchor="middle" fill="#18324b" font-size="15">attendance write</text><path d="M 1330 1475 H 1090" fill="none" stroke="#254c72" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arrow)"/><path d="M 30 1495 H 1670" stroke="#90a4b8" stroke-dasharray="5 4"/><text x="70" y="1516" text-anchor="start" fill="#34537a" font-size="15">[Valid request; record already exists]</text><text x="1210" y="1557" text-anchor="middle" fill="#18324b" font-size="15">14. Return existing record;</text><text x="1210" y="1577" text-anchor="middle" fill="#18324b" font-size="15">do not overwrite</text><text x="1210" y="1597" text-anchor="middle" fill="#18324b" font-size="15">corrections</text><path d="M 1330 1617 H 1090" fill="none" stroke="#254c72" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arrow)"/><path d="M 30 1637 H 1670" stroke="#90a4b8" stroke-dasharray="5 4"/><text x="70" y="1658" text-anchor="start" fill="#34537a" font-size="15">[Valid request; no record exists]</text><text x="1450" y="1699" text-anchor="middle" fill="#18324b" font-size="15">15. Create</text><text x="1450" y="1719" text-anchor="middle" fill="#18324b" font-size="15">attendance_records/{sessionId}_{uid};</text><text x="1450" y="1739" text-anchor="middle" fill="#18324b" font-size="15">server timestamp</text><path d="M 1330 1759 H 1570" fill="none" stroke="#254c72" stroke-width="1.5"  marker-end="url(#arrow)"/><text x="1450" y="1795" text-anchor="middle" fill="#18324b" font-size="15">16. Transaction committed</text><path d="M 1570 1815 H 1330" fill="none" stroke="#254c72" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arrow)"/><text x="1210" y="1851" text-anchor="middle" fill="#18324b" font-size="15">17. Attendance record</text><path d="M 1330 1871 H 1090" fill="none" stroke="#254c72" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arrow)"/><text x="970" y="1951" text-anchor="middle" fill="#18324b" font-size="15">18.</text><text x="970" y="1971" text-anchor="middle" fill="#18324b" font-size="15">Success(AttendanceRecord)</text><text x="970" y="1991" text-anchor="middle" fill="#18324b" font-size="15">or Failure(AppFailure)</text><path d="M 1090 2011 H 850" fill="none" stroke="#254c72" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arrow)"/><text x="610" y="2047" text-anchor="middle" fill="#18324b" font-size="15">19. Result; clear submitting state</text><path d="M 850 2067 H 370" fill="none" stroke="#254c72" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arrow)"/><text x="250" y="2103" text-anchor="middle" fill="#18324b" font-size="15">20. Confirm course /</text><text x="250" y="2123" text-anchor="middle" fill="#18324b" font-size="15">lecture, or show actionable</text><text x="250" y="2143" text-anchor="middle" fill="#18324b" font-size="15">error</text><path d="M 370 2163 H 130" fill="none" stroke="#254c72" stroke-width="1.5"  marker-end="url(#arrow)"/><rect x="45" y="2203" width="1610" height="37" rx="5" fill="#fff5ce" stroke="#d6bd68"/><text x="850" y="2221" text-anchor="middle" fill="#18324b" font-size="15">Online confirmation required. Network failures are retryable; deterministic record IDs prevent duplicate attendance.</text><rect x="45" y="2255" width="1610" height="37" rx="5" fill="#fff5ce" stroke="#d6bd68"/><text x="850" y="2273" text-anchor="middle" fill="#18324b" font-size="15">Signing secrets stay server-side. GPS is client-reported evidence, not proof against location spoofing.</text></g></svg>