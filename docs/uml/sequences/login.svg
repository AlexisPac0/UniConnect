<svg xmlns="http://www.w3.org/2000/svg" width="1940" height="2800" viewBox="0 0 1940 2800"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#254c72"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Arial, sans-serif"><text x="35" y="40" text-anchor="start" fill="#132d48" font-size="27">Login and role-based navigation</text><text x="35" y="72" text-anchor="start" fill="#536a80" font-size="17">Implemented flow on main (e8ffcf7)</text><path d="M 130 185 V 2780" stroke="#bdc8d3" stroke-dasharray="6 6"/><rect x="20" y="100" width="220" height="85" rx="5" fill="#eaf1fa" stroke="#6586a8"/><text x="130" y="125" text-anchor="middle" fill="#18324b" font-size="15">User</text><path d="M 370 185 V 2780" stroke="#bdc8d3" stroke-dasharray="6 6"/><rect x="260" y="100" width="220" height="85" rx="5" fill="#eaf1fa" stroke="#6586a8"/><text x="370" y="125" text-anchor="middle" fill="#18324b" font-size="15">LoginPage / LoginCubit</text><path d="M 610 185 V 2780" stroke="#bdc8d3" stroke-dasharray="6 6"/><rect x="500" y="100" width="220" height="85" rx="5" fill="#eaf1fa" stroke="#6586a8"/><text x="610" y="125" text-anchor="middle" fill="#18324b" font-size="15">Auth domain use cases</text><path d="M 850 185 V 2780" stroke="#bdc8d3" stroke-dasharray="6 6"/><rect x="740" y="100" width="220" height="85" rx="5" fill="#eaf1fa" stroke="#6586a8"/><text x="850" y="125" text-anchor="middle" fill="#18324b" font-size="15">AuthRepositoryImpl /</text><text x="850" y="144" text-anchor="middle" fill="#18324b" font-size="15">FirebaseAuthDataSource</text><path d="M 1090 185 V 2780" stroke="#bdc8d3" stroke-dasharray="6 6"/><rect x="980" y="100" width="220" height="85" rx="5" fill="#eaf1fa" stroke="#6586a8"/><text x="1090" y="125" text-anchor="middle" fill="#18324b" font-size="15">Firebase Authentication</text><path d="M 1330 185 V 2780" stroke="#bdc8d3" stroke-dasharray="6 6"/><rect x="1220" y="100" width="220" height="85" rx="5" fill="#eaf1fa" stroke="#6586a8"/><text x="1330" y="125" text-anchor="middle" fill="#18324b" font-size="15">SessionController /</text><text x="1330" y="144" text-anchor="middle" fill="#18324b" font-size="15">AppSession / Router</text><path d="M 1570 185 V 2780" stroke="#bdc8d3" stroke-dasharray="6 6"/><rect x="1460" y="100" width="220" height="85" rx="5" fill="#eaf1fa" stroke="#6586a8"/><text x="1570" y="125" text-anchor="middle" fill="#18324b" font-size="15">GetUserProfile / Profile</text><text x="1570" y="144" text-anchor="middle" fill="#18324b" font-size="15">repository + data source</text><path d="M 1810 185 V 2780" stroke="#bdc8d3" stroke-dasharray="6 6"/><rect x="1700" y="100" width="220" height="85" rx="5" fill="#eaf1fa" stroke="#6586a8"/><text x="1810" y="125" text-anchor="middle" fill="#18324b" font-size="15">Cloud Firestore</text><rect x="32" y="835" width="1876" height="584" fill="none" stroke="#90a4b8"/><rect x="24" y="495" width="1892" height="946" fill="none" stroke="#90a4b8"/><rect x="32" y="2001" width="1876" height="668" fill="none" stroke="#90a4b8"/><rect x="24" y="1447" width="1892" height="1244" fill="none" stroke="#90a4b8"/><rect x="45" y="197" width="1850" height="37" rx="5" fill="#fff5ce" stroke="#d6bd68"/><text x="970" y="215" text-anchor="middle" fill="#18324b" font-size="15">Domain use cases depend on repository interfaces; concrete data implementations are injected.</text><text x="250" y="267" text-anchor="middle" fill="#18324b" font-size="15">1. Submit email and</text><text x="250" y="287" text-anchor="middle" fill="#18324b" font-size="15">password</text><path d="M 130 307 H 370" fill="none" stroke="#254c72" stroke-width="1.5"  marker-end="url(#arrow)"/><text x="380" y="343" text-anchor="start" fill="#18324b" font-size="15">2. Emit LoginSubmitting;</text><text x="380" y="363" text-anchor="start" fill="#18324b" font-size="15">show loading</text><path d="M 370 383 h 190 v 18 h -190" fill="none" stroke="#254c72" stroke-width="1.5"  marker-end="url(#arrow)"/><text x="490" y="435" text-anchor="middle" fill="#18324b" font-size="15">3.</text><text x="490" y="455" text-anchor="middle" fill="#18324b" font-size="15">SignInWithEmail(SignInParams)</text><path d="M 370 475 H 610" fill="none" stroke="#254c72" stroke-width="1.5"  marker-end="url(#arrow)"/><text x="46" y="516" text-anchor="start" fill="#34537a" font-size="15">alt [Empty email or password]</text><text x="490" y="557" text-anchor="middle" fill="#18324b" font-size="15">4.</text><text x="490" y="577" text-anchor="middle" fill="#18324b" font-size="15">Failure(InvalidCredentialsFailure);</text><text x="490" y="597" text-anchor="middle" fill="#18324b" font-size="15">show message</text><path d="M 610 617 H 370" fill="none" stroke="#254c72" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arrow)"/><path d="M 30 637 H 1910" stroke="#90a4b8" stroke-dasharray="5 4"/><text x="54" y="658" text-anchor="start" fill="#34537a" font-size="15">[Nonempty credentials (email is trimmed)]</text><text x="730" y="699" text-anchor="middle" fill="#18324b" font-size="15">5. signInWithEmail(email,</text><text x="730" y="719" text-anchor="middle" fill="#18324b" font-size="15">password)</text><path d="M 610 739 H 850" fill="none" stroke="#254c72" stroke-width="1.5"  marker-end="url(#arrow)"/><text x="970" y="775" text-anchor="middle" fill="#18324b" font-size="15">6.</text><text x="970" y="795" text-anchor="middle" fill="#18324b" font-size="15">signInWithEmailAndPassword</text><path d="M 850 815 H 1090" fill="none" stroke="#254c72" stroke-width="1.5"  marker-end="url(#arrow)"/><text x="54" y="856" text-anchor="start" fill="#34537a" font-size="15">alt [Authentication fails]</text><text x="970" y="897" text-anchor="middle" fill="#18324b" font-size="15">7. Firebase error</text><text x="970" y="917" text-anchor="middle" fill="#18324b" font-size="15">(credentials / disabled /</text><text x="970" y="937" text-anchor="middle" fill="#18324b" font-size="15">network / rate limit)</text><path d="M 1090 957 H 850" fill="none" stroke="#254c72" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arrow)"/><text x="730" y="993" text-anchor="middle" fill="#18324b" font-size="15">8. Failure(AppFailure), no</text><text x="730" y="1013" text-anchor="middle" fill="#18324b" font-size="15">raw exception</text><path d="M 850 1033 H 610" fill="none" stroke="#254c72" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arrow)"/><text x="490" y="1069" text-anchor="middle" fill="#18324b" font-size="15">9. Failure; emit</text><text x="490" y="1089" text-anchor="middle" fill="#18324b" font-size="15">LoginFailure and show</text><text x="490" y="1109" text-anchor="middle" fill="#18324b" font-size="15">message</text><path d="M 610 1129 H 370" fill="none" stroke="#254c72" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arrow)"/><path d="M 30 1149 H 1910" stroke="#90a4b8" stroke-dasharray="5 4"/><text x="62" y="1170" text-anchor="start" fill="#34537a" font-size="15">[Authentication succeeds]</text><text x="970" y="1211" text-anchor="middle" fill="#18324b" font-size="15">10. UserCredential</text><path d="M 1090 1231 H 850" fill="none" stroke="#254c72" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arrow)"/><text x="730" y="1267" text-anchor="middle" fill="#18324b" font-size="15">11. Success(AuthUser)</text><path d="M 850 1287 H 610" fill="none" stroke="#254c72" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arrow)"/><text x="490" y="1323" text-anchor="middle" fill="#18324b" font-size="15">12. Success; emit</text><text x="490" y="1343" text-anchor="middle" fill="#18324b" font-size="15">LoginSuccess (no navigation</text><text x="490" y="1363" text-anchor="middle" fill="#18324b" font-size="15">here)</text><path d="M 610 1383 H 370" fill="none" stroke="#254c72" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arrow)"/><text x="46" y="1468" text-anchor="start" fill="#34537a" font-size="15">group [Independent auth-state subscription, established at startup]</text><text x="970" y="1509" text-anchor="middle" fill="#18324b" font-size="15">13. authStateChanges emits</text><text x="970" y="1529" text-anchor="middle" fill="#18324b" font-size="15">signed-in user</text><path d="M 1090 1549 H 850" fill="none" stroke="#254c72" stroke-width="1.5"  marker-end="url(#arrow)"/><text x="730" y="1585" text-anchor="middle" fill="#18324b" font-size="15">14. Mapped AuthUser through</text><text x="730" y="1605" text-anchor="middle" fill="#18324b" font-size="15">WatchAuthState</text><path d="M 850 1625 H 610" fill="none" stroke="#254c72" stroke-width="1.5"  marker-end="url(#arrow)"/><text x="970" y="1661" text-anchor="middle" fill="#18324b" font-size="15">15. Auth-state event</text><path d="M 610 1681 H 1330" fill="none" stroke="#254c72" stroke-width="1.5"  marker-end="url(#arrow)"/><text x="1340" y="1717" text-anchor="start" fill="#18324b" font-size="15">16. setLoading; router</text><text x="1340" y="1737" text-anchor="start" fill="#18324b" font-size="15">shows splash</text><path d="M 1330 1757 h 190 v 18 h -190" fill="none" stroke="#254c72" stroke-width="1.5"  marker-end="url(#arrow)"/><text x="1450" y="1809" text-anchor="middle" fill="#18324b" font-size="15">17. GetUserProfile(user.id)</text><text x="1450" y="1829" text-anchor="middle" fill="#18324b" font-size="15">via repository interface</text><path d="M 1330 1849 H 1570" fill="none" stroke="#254c72" stroke-width="1.5"  marker-end="url(#arrow)"/><text x="1690" y="1885" text-anchor="middle" fill="#18324b" font-size="15">18. Read users/{uid}</text><path d="M 1570 1905 H 1810" fill="none" stroke="#254c72" stroke-width="1.5"  marker-end="url(#arrow)"/><text x="1690" y="1941" text-anchor="middle" fill="#18324b" font-size="15">19. Profile document or</text><text x="1690" y="1961" text-anchor="middle" fill="#18324b" font-size="15">read error</text><path d="M 1810 1981 H 1570" fill="none" stroke="#254c72" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arrow)"/><text x="54" y="2022" text-anchor="start" fill="#34537a" font-size="15">alt [Valid profile; this auth event is still current]</text><text x="1450" y="2063" text-anchor="middle" fill="#18324b" font-size="15">20. Success(UserProfile)</text><path d="M 1570 2083 H 1330" fill="none" stroke="#254c72" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arrow)"/><text x="1340" y="2119" text-anchor="start" fill="#18324b" font-size="15">21. setSignedIn with</text><text x="1340" y="2139" text-anchor="start" fill="#18324b" font-size="15">profile role; refresh</text><text x="1340" y="2159" text-anchor="start" fill="#18324b" font-size="15">router</text><path d="M 1330 2179 h 190 v 18 h -190" fill="none" stroke="#254c72" stroke-width="1.5"  marker-end="url(#arrow)"/><text x="730" y="2231" text-anchor="middle" fill="#18324b" font-size="15">22. Open student, professor, or admin home</text><path d="M 1330 2251 H 130" fill="none" stroke="#254c72" stroke-width="1.5"  marker-end="url(#arrow)"/><path d="M 30 2271 H 1910" stroke="#90a4b8" stroke-dasharray="5 4"/><text x="62" y="2292" text-anchor="start" fill="#34537a" font-size="15">[Missing / invalid profile or read failure]</text><text x="1450" y="2333" text-anchor="middle" fill="#18324b" font-size="15">23. Failure(AppFailure)</text><path d="M 1570 2353 H 1330" fill="none" stroke="#254c72" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arrow)"/><text x="1340" y="2389" text-anchor="start" fill="#18324b" font-size="15">24.</text><text x="1340" y="2409" text-anchor="start" fill="#18324b" font-size="15">setSignedOut(errorMessage);</text><text x="1340" y="2429" text-anchor="start" fill="#18324b" font-size="15">return to login</text><path d="M 1330 2449 h 190 v 18 h -190" fill="none" stroke="#254c72" stroke-width="1.5"  marker-end="url(#arrow)"/><text x="970" y="2501" text-anchor="middle" fill="#18324b" font-size="15">25. SignOut(NoParams)</text><path d="M 1330 2521 H 610" fill="none" stroke="#254c72" stroke-width="1.5"  marker-end="url(#arrow)"/><text x="730" y="2557" text-anchor="middle" fill="#18324b" font-size="15">26. signOut()</text><path d="M 610 2577 H 850" fill="none" stroke="#254c72" stroke-width="1.5"  marker-end="url(#arrow)"/><text x="970" y="2613" text-anchor="middle" fill="#18324b" font-size="15">27. signOut()</text><path d="M 850 2633 H 1090" fill="none" stroke="#254c72" stroke-width="1.5"  marker-end="url(#arrow)"/><rect x="45" y="2695" width="1850" height="37" rx="5" fill="#fff5ce" stroke="#d6bd68"/><text x="970" y="2713" text-anchor="middle" fill="#18324b" font-size="15">Auth events may arrive before sign-in returns. Stale profile loads are ignored; signed-out events preserve the error message.</text></g></svg>