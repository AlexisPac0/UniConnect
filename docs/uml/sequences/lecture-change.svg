<svg xmlns="http://www.w3.org/2000/svg" width="1940" height="2726" viewBox="0 0 1940 2726"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#254c72"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Arial, sans-serif"><text x="35" y="40" text-anchor="start" fill="#132d48" font-size="27">Lecture change and push notification</text><text x="35" y="72" text-anchor="start" fill="#536a80" font-size="17">Proposed flow: SCRUM-33 and SCRUM-35</text><path d="M 130 185 V 2706" stroke="#bdc8d3" stroke-dasharray="6 6"/><rect x="20" y="100" width="220" height="85" rx="5" fill="#eaf1fa" stroke="#6586a8"/><text x="130" y="125" text-anchor="middle" fill="#18324b" font-size="15">Professor</text><path d="M 370 185 V 2706" stroke="#bdc8d3" stroke-dasharray="6 6"/><rect x="260" y="100" width="220" height="85" rx="5" fill="#eaf1fa" stroke="#6586a8"/><text x="370" y="125" text-anchor="middle" fill="#18324b" font-size="15">Lecture editor / Cubit</text><path d="M 610 185 V 2706" stroke="#bdc8d3" stroke-dasharray="6 6"/><rect x="500" y="100" width="220" height="85" rx="5" fill="#eaf1fa" stroke="#6586a8"/><text x="610" y="125" text-anchor="middle" fill="#18324b" font-size="15">Lecture change / read use</text><text x="610" y="144" text-anchor="middle" fill="#18324b" font-size="15">cases</text><path d="M 850 185 V 2706" stroke="#bdc8d3" stroke-dasharray="6 6"/><rect x="740" y="100" width="220" height="85" rx="5" fill="#eaf1fa" stroke="#6586a8"/><text x="850" y="125" text-anchor="middle" fill="#18324b" font-size="15">TimetableRepositoryImpl /</text><text x="850" y="144" text-anchor="middle" fill="#18324b" font-size="15">Firestore data source</text><path d="M 1090 185 V 2706" stroke="#bdc8d3" stroke-dasharray="6 6"/><rect x="980" y="100" width="220" height="85" rx="5" fill="#eaf1fa" stroke="#6586a8"/><text x="1090" y="125" text-anchor="middle" fill="#18324b" font-size="15">Cloud Firestore + rules</text><path d="M 1330 185 V 2706" stroke="#bdc8d3" stroke-dasharray="6 6"/><rect x="1220" y="100" width="220" height="85" rx="5" fill="#eaf1fa" stroke="#6586a8"/><text x="1330" y="125" text-anchor="middle" fill="#18324b" font-size="15">Lecture-change Cloud</text><text x="1330" y="144" text-anchor="middle" fill="#18324b" font-size="15">Function</text><path d="M 1570 185 V 2706" stroke="#bdc8d3" stroke-dasharray="6 6"/><rect x="1460" y="100" width="220" height="85" rx="5" fill="#eaf1fa" stroke="#6586a8"/><text x="1570" y="125" text-anchor="middle" fill="#18324b" font-size="15">Firebase Cloud Messaging</text><path d="M 1810 185 V 2706" stroke="#bdc8d3" stroke-dasharray="6 6"/><rect x="1700" y="100" width="220" height="85" rx="5" fill="#eaf1fa" stroke="#6586a8"/><text x="1810" y="125" text-anchor="middle" fill="#18324b" font-size="15">Student device / app</text><rect x="40" y="1363" width="1860" height="1210" fill="none" stroke="#90a4b8"/><rect x="32" y="855" width="1876" height="1740" fill="none" stroke="#90a4b8"/><rect x="24" y="515" width="1892" height="2102" fill="none" stroke="#90a4b8"/><rect x="45" y="197" width="1850" height="37" rx="5" fill="#fff5ce" stroke="#d6bd68"/><text x="970" y="215" text-anchor="middle" fill="#18324b" font-size="15">Preconditions: professor teaches the course; affected students have registered device tokens and enabled notifications.</text><text x="250" y="267" text-anchor="middle" fill="#18324b" font-size="15">1. Change room / times, or</text><text x="250" y="287" text-anchor="middle" fill="#18324b" font-size="15">cancel with optional reason</text><path d="M 130 307 H 370" fill="none" stroke="#254c72" stroke-width="1.5"  marker-end="url(#arrow)"/><text x="490" y="343" text-anchor="middle" fill="#18324b" font-size="15">2. Submit change; show</text><text x="490" y="363" text-anchor="middle" fill="#18324b" font-size="15">loading</text><path d="M 370 383 H 610" fill="none" stroke="#254c72" stroke-width="1.5"  marker-end="url(#arrow)"/><text x="620" y="419" text-anchor="start" fill="#18324b" font-size="15">3. Validate required room</text><text x="620" y="439" text-anchor="start" fill="#18324b" font-size="15">and end after start for</text><text x="620" y="459" text-anchor="start" fill="#18324b" font-size="15">reschedule</text><path d="M 610 479 h 190 v 18 h -190" fill="none" stroke="#254c72" stroke-width="1.5"  marker-end="url(#arrow)"/><text x="46" y="536" text-anchor="start" fill="#34537a" font-size="15">alt [Invalid input]</text><text x="490" y="577" text-anchor="middle" fill="#18324b" font-size="15">4. Failure; show validation</text><text x="490" y="597" text-anchor="middle" fill="#18324b" font-size="15">message</text><path d="M 610 617 H 370" fill="none" stroke="#254c72" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arrow)"/><path d="M 30 637 H 1910" stroke="#90a4b8" stroke-dasharray="5 4"/><text x="54" y="658" text-anchor="start" fill="#34537a" font-size="15">[Valid input]</text><text x="730" y="699" text-anchor="middle" fill="#18324b" font-size="15">5. rescheduleLecture(...)</text><text x="730" y="719" text-anchor="middle" fill="#18324b" font-size="15">or cancelLecture(...)</text><path d="M 610 739 H 850" fill="none" stroke="#254c72" stroke-width="1.5"  marker-end="url(#arrow)"/><text x="970" y="775" text-anchor="middle" fill="#18324b" font-size="15">6. Update lectures/{id};</text><text x="970" y="795" text-anchor="middle" fill="#18324b" font-size="15">enforce assigned-professor</text><text x="970" y="815" text-anchor="middle" fill="#18324b" font-size="15">access</text><path d="M 850 835 H 1090" fill="none" stroke="#254c72" stroke-width="1.5"  marker-end="url(#arrow)"/><text x="54" y="876" text-anchor="start" fill="#34537a" font-size="15">alt [Permission denied or write fails]</text><text x="970" y="917" text-anchor="middle" fill="#18324b" font-size="15">7. Write error</text><path d="M 1090 937 H 850" fill="none" stroke="#254c72" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arrow)"/><text x="730" y="973" text-anchor="middle" fill="#18324b" font-size="15">8. Failure(AppFailure)</text><path d="M 850 993 H 610" fill="none" stroke="#254c72" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arrow)"/><text x="490" y="1029" text-anchor="middle" fill="#18324b" font-size="15">9. Failure; show error, no</text><text x="490" y="1049" text-anchor="middle" fill="#18324b" font-size="15">notification triggered</text><path d="M 610 1069 H 370" fill="none" stroke="#254c72" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arrow)"/><path d="M 30 1089 H 1910" stroke="#90a4b8" stroke-dasharray="5 4"/><text x="62" y="1110" text-anchor="start" fill="#34537a" font-size="15">[Write committed]</text><text x="970" y="1151" text-anchor="middle" fill="#18324b" font-size="15">10. Committed lecture</text><text x="970" y="1171" text-anchor="middle" fill="#18324b" font-size="15">update</text><path d="M 1090 1191 H 850" fill="none" stroke="#254c72" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arrow)"/><text x="730" y="1227" text-anchor="middle" fill="#18324b" font-size="15">11. Success(Lecture) or</text><text x="730" y="1247" text-anchor="middle" fill="#18324b" font-size="15">Success(void)</text><path d="M 850 1267 H 610" fill="none" stroke="#254c72" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arrow)"/><text x="490" y="1303" text-anchor="middle" fill="#18324b" font-size="15">12. Show saved change (not</text><text x="490" y="1323" text-anchor="middle" fill="#18324b" font-size="15">a delivery receipt)</text><path d="M 610 1343 H 370" fill="none" stroke="#254c72" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arrow)"/><text x="62" y="1384" text-anchor="start" fill="#34537a" font-size="15">group [Asynchronous notification after commit]</text><text x="1210" y="1425" text-anchor="middle" fill="#18324b" font-size="15">13. Lecture update event:</text><text x="1210" y="1445" text-anchor="middle" fill="#18324b" font-size="15">before / after / event ID</text><path d="M 1090 1465 H 1330" fill="none" stroke="#254c72" stroke-width="1.5"  marker-end="url(#arrow)"/><text x="1340" y="1501" text-anchor="start" fill="#18324b" font-size="15">14. Ignore unchanged room,</text><text x="1340" y="1521" text-anchor="start" fill="#18324b" font-size="15">times and status;</text><text x="1340" y="1541" text-anchor="start" fill="#18324b" font-size="15">deduplicate retries</text><path d="M 1330 1561 h 190 v 18 h -190" fill="none" stroke="#254c72" stroke-width="1.5"  marker-end="url(#arrow)"/><text x="1210" y="1613" text-anchor="middle" fill="#18324b" font-size="15">15. Query course enrolments</text><text x="1210" y="1633" text-anchor="middle" fill="#18324b" font-size="15">and users.fcmTokens</text><path d="M 1330 1653 H 1090" fill="none" stroke="#254c72" stroke-width="1.5"  marker-end="url(#arrow)"/><text x="1210" y="1689" text-anchor="middle" fill="#18324b" font-size="15">16. Affected students and</text><text x="1210" y="1709" text-anchor="middle" fill="#18324b" font-size="15">registration tokens</text><path d="M 1090 1729 H 1330" fill="none" stroke="#254c72" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arrow)"/><text x="1450" y="1765" text-anchor="middle" fill="#18324b" font-size="15">17. Send batched alert with</text><text x="1450" y="1785" text-anchor="middle" fill="#18324b" font-size="15">lectureId and event ID</text><path d="M 1330 1805 H 1570" fill="none" stroke="#254c72" stroke-width="1.5"  marker-end="url(#arrow)"/><text x="1450" y="1841" text-anchor="middle" fill="#18324b" font-size="15">18. Per-token acceptance or</text><text x="1450" y="1861" text-anchor="middle" fill="#18324b" font-size="15">send error</text><path d="M 1570 1881 H 1330" fill="none" stroke="#254c72" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arrow)"/><text x="1340" y="1917" text-anchor="start" fill="#18324b" font-size="15">19. Remove invalid tokens;</text><text x="1340" y="1937" text-anchor="start" fill="#18324b" font-size="15">retry transient failures</text><path d="M 1330 1957 h 190 v 18 h -190" fill="none" stroke="#254c72" stroke-width="1.5"  marker-end="url(#arrow)"/><text x="1690" y="2009" text-anchor="middle" fill="#18324b" font-size="15">20. Deliver notification</text><text x="1690" y="2029" text-anchor="middle" fill="#18324b" font-size="15">when possible</text><path d="M 1570 2049 H 1810" fill="none" stroke="#254c72" stroke-width="1.5"  marker-end="url(#arrow)"/><text x="1800" y="2085" text-anchor="end" fill="#18324b" font-size="15">21. Tap: session guard</text><text x="1800" y="2105" text-anchor="end" fill="#18324b" font-size="15">opens lecture details</text><path d="M 1810 2125 h -190 v 18 h 190" fill="none" stroke="#254c72" stroke-width="1.5"  marker-end="url(#arrow)"/><text x="1210" y="2177" text-anchor="middle" fill="#18324b" font-size="15">22. Read current lecture through domain use case</text><path d="M 1810 2197 H 610" fill="none" stroke="#254c72" stroke-width="1.5"  marker-end="url(#arrow)"/><text x="730" y="2233" text-anchor="middle" fill="#18324b" font-size="15">23. Fetch authorized</text><text x="730" y="2253" text-anchor="middle" fill="#18324b" font-size="15">lecture details</text><path d="M 610 2273 H 850" fill="none" stroke="#254c72" stroke-width="1.5"  marker-end="url(#arrow)"/><text x="970" y="2309" text-anchor="middle" fill="#18324b" font-size="15">24. Read lectures/{id}</text><text x="970" y="2329" text-anchor="middle" fill="#18324b" font-size="15">under security rules</text><path d="M 850 2349 H 1090" fill="none" stroke="#254c72" stroke-width="1.5"  marker-end="url(#arrow)"/><text x="970" y="2385" text-anchor="middle" fill="#18324b" font-size="15">25. Current lecture or</text><text x="970" y="2405" text-anchor="middle" fill="#18324b" font-size="15">access / network error</text><path d="M 1090 2425 H 850" fill="none" stroke="#254c72" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arrow)"/><text x="730" y="2461" text-anchor="middle" fill="#18324b" font-size="15">26. Result</text><path d="M 850 2481 H 610" fill="none" stroke="#254c72" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arrow)"/><text x="1210" y="2517" text-anchor="middle" fill="#18324b" font-size="15">27. Display current state or error</text><path d="M 610 2537 H 1810" fill="none" stroke="#254c72" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arrow)"/><rect x="45" y="2621" width="1850" height="37" rx="5" fill="#fff5ce" stroke="#d6bd68"/><text x="970" y="2639" text-anchor="middle" fill="#18324b" font-size="15">Push is best effort; delivery failure never rolls back the lecture. Firestore remains the source of truth.</text></g></svg>